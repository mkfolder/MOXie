services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      - CONFIG_PATH=./default.yaml
      - DATABASE_URL=postgres://moxie_owner:passwd@postgres:5432/moxie?sslmode=disable
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_ENDPOINT=http://garage:3900
      - AWS_REQUEST_CHECKSUM_CALCULATION=false
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://127.0.0.1:7654/api/health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - moxie-net

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - API_URL=http://localhost
    depends_on:
      api:
        condition: service_healthy
    networks:
      - moxie-net

  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
      ui:
        condition: service_started
    environment:
      - CADDY_PORT=80
      - API_HOST=api:7654
      - UI_HOST=ui:4321
    networks:
      - moxie-net

  garage:
    image: dxflrs/garage:v2.0.0
    ports:
      - "3900:3900" # S3 API
      - "3901:3901" # RPC
      - "3902:3902" # Web (static sites)
      - "3903:3903" # Admin API
    volumes:
      - ./garage.toml:/etc/garage.toml
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    environment:
      - GARAGE_CONFIG_FILE=/etc/garage.toml
    networks:
      - moxie-net

  garage-webui:
    image: khairul169/garage-webui:latest
    container_name: garage-webui
    restart: unless-stopped
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
    ports:
      - 3909:3909
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"
    networks:
      - moxie-net

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=moxie_owner
      - POSTGRES_PASSWORD=passwd
      - POSTGRES_DB=moxie
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moxie_owner -d moxie"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moxie-net

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: "root@root.io"
      PGADMIN_DEFAULT_PASSWORD: "toor"
    ports:
      - "1444:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - moxie-net

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/postgres_data
  pgadmin_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/pgadmin_data
  garage_meta:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/garage_meta
  garage_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/garage_data

networks:
  moxie-net:
