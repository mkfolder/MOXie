app = 'moxie-ui'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 4321
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
